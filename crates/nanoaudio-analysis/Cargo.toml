[package]
name = "nanoaudio-analysis"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free audio analyzers for nanoaudio pipelines and sample slices."
documentation = "https://docs.rs/nanoaudio-analysis"
readme = "README.md"
keywords = ["audio", "no-std", "embedded", "meter", "analysis"]
categories = ["multimedia::audio", "embedded", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
nanoaudio-core.workspace = true
nanoaudio-dsp.workspace = true
libm = "0.2"
microfft = { version = "0.6", default-features = false, features = ["size-1024"], optional = true }

[features]
fft = ["dep:microfft"]

[lints]
workspace = true
