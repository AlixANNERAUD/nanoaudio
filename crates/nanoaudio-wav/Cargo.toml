[package]
name = "nanoaudio-wav"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free WAV header parser and decoder for PCM, G.711 and ADPCM files."
documentation = "https://docs.rs/nanoaudio-wav"
readme = "README.md"
keywords = ["audio", "no-std", "embedded", "wav", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding", "embedded", "no-std", "no-std::no-alloc"]
