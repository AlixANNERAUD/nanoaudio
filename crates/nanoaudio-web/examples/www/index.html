<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nanoaudio-web</title>
</head>
<body>
  <h1>nanoaudio-web</h1>
  <p>
    <button id="sine">Play a 440 Hz sine</button>
    <label>Play a WAV file <input id="wav" type="file" accept=".wav,audio/wav"></label>
    <label>with the audio context at
      <select id="rate">
        <option value="0">the file's rate</option>
        <option value="48000" selected>48000 Hz</option>
        <option value="44100">44100 Hz</option>
        <option value="96000">96000 Hz</option>
      </select>
    </label>
    <label>resampling with
      <select id="quality">
        <option value="sinc" selected>sinc</option>
        <option value="linear">linear</option>
      </select>
    </label>
    <button id="listen">Show the microphone level</button>
    <button id="stop">Stop</button>
  </p>
  <p>Stream: <output id="stream"></output>, audio context: <output id="context"></output></p>
  <p>Underruns: <output id="underruns">0</output></p>
  <p>Microphone peak: <meter id="level" max="1"></meter> <output id="overruns"></output></p>
  <script type="module">
    import init, { play_sine, play_wav, listen } from "./pkg/player.js";

    await init();

    const element = (id) => document.getElementById(id);
    let playback;
    let capture;
    let timer;

    const stop = () => {
      clearInterval(timer);
      playback?.free();
      capture?.free();
      playback = undefined;
      capture = undefined;
    };

    const play = async (start) => {
      stop();
      playback = await start();
      element("stream").value = `${playback.sample_rate()} Hz`;
      element("context").value = `${playback.device_sample_rate()} Hz`;
      timer = setInterval(() => element("underruns").value = playback.underruns(), 250);
    };

    element("sine").onclick = () => play(play_sine);
    element("wav").onchange = async (event) => {
      const file = event.target.files[0];
      if (file !== undefined) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const rate = Number(element("rate").value);
        const linear = element("quality").value === "linear";
        await play(() => play_wav(bytes, rate, linear));
      }
    };
    element("listen").onclick = async () => {
      stop();
      capture = await listen((level) => element("level").value = level);
      timer = setInterval(() => element("overruns").value = `${capture.overruns()} overruns`, 250);
    };
    element("stop").onclick = stop;
  </script>
</body>
</html>
