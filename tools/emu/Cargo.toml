[package]
name = "nanoaudio-emu"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
nanoaudio-core = { path = "../../crates/nanoaudio-core" }
nanoaudio-dsp = { path = "../../crates/nanoaudio-dsp" }
nanoaudio-analysis = { path = "../../crates/nanoaudio-analysis", features = ["fft"] }
nanoaudio-g711 = { path = "../../crates/nanoaudio-g711" }
nanoaudio-adpcm = { path = "../../crates/nanoaudio-adpcm" }
nanoaudio-qoa = { path = "../../crates/nanoaudio-qoa" }
nanoaudio-flac = { path = "../../crates/nanoaudio-flac" }
nanoaudio-g722 = { path = "../../crates/nanoaudio-g722" }
nanoaudio-sbc = { path = "../../crates/nanoaudio-sbc" }
nanoaudio-mp3 = { path = "../../crates/nanoaudio-mp3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
