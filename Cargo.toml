[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
repository = "https://github.com/AlixANNERAUD/nanoaudio"
license = "MIT"

[workspace.dependencies]
nanoaudio-core = { version = "0.1.0", path = "crates/nanoaudio-core" }
nanoaudio-buffer = { version = "0.1.0", path = "crates/nanoaudio-buffer" }
nanoaudio-dsp = { version = "0.1.0", path = "crates/nanoaudio-dsp" }
nanoaudio-g711 = { version = "0.1.0", path = "crates/nanoaudio-g711" }
nanoaudio-adpcm = { version = "0.1.0", path = "crates/nanoaudio-adpcm" }
nanoaudio-qoa = { version = "0.1.0", path = "crates/nanoaudio-qoa" }
nanoaudio-flac = { version = "0.1.0", path = "crates/nanoaudio-flac" }
nanoaudio-g722 = { version = "0.1.0", path = "crates/nanoaudio-g722" }
nanoaudio-sbc = { version = "0.1.0", path = "crates/nanoaudio-sbc" }
nanoaudio-mp3 = { version = "0.1.0", path = "crates/nanoaudio-mp3" }
nanoaudio-wav = { version = "0.1.0", path = "crates/nanoaudio-wav" }
nanoaudio-aiff = { version = "0.1.0", path = "crates/nanoaudio-aiff" }
nanoaudio-metadata = { version = "0.1.0", path = "crates/nanoaudio-metadata" }
nanomp3-core = { version = "0.2", default-features = false }
wide = { version = "1.7", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
