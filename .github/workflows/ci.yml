name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf, riscv32imafc-unknown-none-elf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features fixed
      - run: cargo test --features float
      - run: cargo build --target thumbv6m-none-eabi
      - run: cargo build --target thumbv7em-none-eabihf
      - run: cargo build --target riscv32imc-unknown-none-elf
      - run: cargo build --target riscv32imafc-unknown-none-elf

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test
