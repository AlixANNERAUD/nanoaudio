name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      asm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.asm == 'true' }}
      bench: ${{ github.event_name != 'pull_request' || steps.filter.outputs.bench == 'true' }}
      emu: ${{ github.event_name != 'pull_request' || steps.filter.outputs.emu == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/check.yml'
            rust:
              - *shared
              - 'crates/**'
              - 'README.md'
            asm:
              - *shared
              - 'tools/asm-probe/**'
              - 'crates/nanoaudio-adpcm/**'
              - 'crates/nanoaudio-core/**'
              - 'crates/nanoaudio-dsp/**'
              - 'crates/nanoaudio-g711/**'
              - 'crates/nanoaudio-qoa/**'
              - 'crates/nanoaudio-sbc/**'
              - 'crates/nanoaudio-synth/**'
            bench:
              - *shared
              - 'crates/**'
              - 'tools/bench/**'
            emu:
              - *shared
              - 'crates/**'
              - 'tools/emu/**'
            desktop:
              - *shared
              - 'crates/nanoaudio-cpal/**'
              - 'crates/nanoaudio-core/**'
              - 'crates/nanoaudio-buffer/**'
              - 'crates/nanoaudio-dsp/**'
            web:
              - *shared
              - 'crates/**'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy with all Features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace

      - name: Test optimized
        run: cargo test --workspace --release

      - name: Test without default Features
        run: cargo test -p nanoaudio --no-default-features

      - name: Test with fixed
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features fixed

      - name: Test with float
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features float

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test with all Features and Coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/nanoaudio
          files: lcov.info
          fail_ci_if_error: true

  coverage-skipped:
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tell Codecov there is no code change
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/nanoaudio
          run_command: empty-upload
          fail_ci_if_error: false

  crates:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test and build each Crate on its own
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::$crate"
            cargo test -p "$crate"
            if cargo metadata --no-deps --format-version 1 | jq -e --arg crate "$crate" '.packages[] | select(.name == $crate) | .categories | index("no-std")' > /dev/null; then
              cargo build -p "$crate" --target thumbv6m-none-eabi
            fi
            echo "::endgroup::"
          done

  embedded:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - riscv32imafc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --workspace --exclude nanoaudio-cpal --target ${{ matrix.target }}

      - name: Build with all Features
        run: cargo build --workspace --exclude nanoaudio-cpal --target ${{ matrix.target }} --all-features

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        simd: [false, true]
    env:
      RUSTFLAGS: ${{ matrix.simd && '-C target-feature=+simd128' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: simd-${{ matrix.simd }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Build for the browser
        run: cargo build --workspace --all-features --target wasm32-unknown-unknown

      - name: Test on WASI
        run: cargo test --workspace --all-features --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=/

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the wasm-bindgen Version
        id: wasm-bindgen
        run: echo "version=$(cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Clippy for the Browser
        run: cargo clippy -p nanoaudio-web --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Documentation for the Browser
        run: cargo doc -p nanoaudio-web --no-deps --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build the Example Page
        run: |
          cargo build -p nanoaudio-web --example player --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir crates/nanoaudio-web/examples/www/pkg target/wasm32-unknown-unknown/release/examples/player.wasm
          test -f crates/nanoaudio-web/examples/www/pkg/player_bg.wasm

      - name: Check the Worklet Scripts
        run: |
          node --check crates/nanoaudio-web/src/worklet.js
          node --check crates/nanoaudio-web/src/polyfill.js

  asm:
    needs: changes
    if: needs.changes.outputs.asm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv8m.base-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf, thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/asm-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Hot Loops
        run: python3 tools/asm-probe/check.py

      - name: Check Hot Loops optimized for Size
        run: python3 tools/asm-probe/check.py --opt-level s

  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/bench
            tools/bench/flash
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the Benchmarks
        run: cargo build --release --manifest-path tools/bench/Cargo.toml

      - name: Run the untimed Benchmarks
        run: |
          cargo run --release --manifest-path tools/bench/Cargo.toml -- memory
          cargo run --release --manifest-path tools/bench/Cargo.toml -- quality

      - name: Build the Flash Probes
        run: cargo build --release --manifest-path tools/bench/flash/Cargo.toml --target thumbv6m-none-eabi

      - name: Build and Smoke-Test the Comparisons
        run: |
          cargo build --release --manifest-path tools/bench/Cargo.toml --features compare
          cargo run --release --manifest-path tools/bench/Cargo.toml --features compare -- compare --runs 1 --target-ms 1 --filter wav,qoa,adpcm

      - name: Check the Scripts
        run: python3 -m py_compile tools/bench/run.py tools/bench/compare.py

  emu:
    needs: changes
    if: needs.changes.outputs.emu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, thumbv8m.main-none-eabihf, riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/emu -> ../../target/emu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Unicorn
        run: |
          python3 -m venv tools/emu/.venv
          tools/emu/.venv/bin/pip install --quiet -r tools/emu/requirements.txt

      - name: Count Instructions
        run: tools/emu/.venv/bin/python tools/emu/run.py | tee -a "$GITHUB_STEP_SUMMARY"

  miri:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: taiki-e/install-action@cargo-nextest

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Miri
        run: cargo miri nextest run --workspace --lib

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace

      - name: Test with all Features
        run: cargo test --workspace --all-features

  package:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Package
        run: cargo package --workspace

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy -p nanoaudio-cpal --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p nanoaudio-cpal --all-features

  ci:
    needs: [changes, lint, test, coverage, crates, embedded, wasm, web, asm, bench, miri, msrv, package, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed Job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          results = {name: job['result'] for name, job in json.load(sys.stdin).items()}
          print(results)
          sys.exit(any(result not in ('success', 'skipped') for result in results.values()))
          "
