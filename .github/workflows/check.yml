name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy with all Features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test without default Features
        run: cargo test -p nanoaudio --no-default-features

      - name: Test with fixed
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features fixed

      - name: Test with float
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features float

      - name: Test with all Features and Coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/nanoaudio
          files: lcov.info
          fail_ci_if_error: true

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Test and build each Crate on its own
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::$crate"
            cargo test -p "$crate"
            cargo build -p "$crate" --target thumbv6m-none-eabi
            echo "::endgroup::"
          done

  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - riscv32imafc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Build with all Features
        run: cargo build --workspace --target ${{ matrix.target }} --all-features

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri
        run: cargo miri test --workspace --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - name: Test
        run: cargo test --workspace

      - name: Test with all Features
        run: cargo test --workspace --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package
        run: cargo package --workspace
