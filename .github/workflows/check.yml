name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with mp3
        run: cargo clippy --all-targets --features mp3 -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps --features mp3
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test

      - name: Test with fixed
        run: cargo test --features fixed

      - name: Test with float
        run: cargo test --features float

      - name: Test with mp3
        run: cargo test --features mp3

      - name: Test with every mp3 option
        run: cargo test --features mp3-simd,mpeg-layer12

  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - riscv32imafc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Build with mp3
        run: cargo build --target ${{ matrix.target }} --features mp3

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri
        run: cargo miri test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - name: Test
        run: cargo test

      - name: Test with mp3
        run: cargo test --features mp3

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package
        run: cargo package
