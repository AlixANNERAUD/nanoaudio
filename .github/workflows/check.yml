name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      asm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.asm == 'true' }}
      bench: ${{ github.event_name != 'pull_request' || steps.filter.outputs.bench == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/check.yml'
            rust:
              - *shared
              - 'crates/**'
              - 'README.md'
            asm:
              - *shared
              - 'tools/asm-probe/**'
              - 'crates/nanoaudio-core/**'
              - 'crates/nanoaudio-dsp/**'
              - 'crates/nanoaudio-g711/**'
              - 'crates/nanoaudio-qoa/**'
            bench:
              - *shared
              - 'crates/**'
              - 'tools/bench/**'

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy with all Features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test without default Features
        run: cargo test -p nanoaudio --no-default-features

      - name: Test with fixed
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features fixed

      - name: Test with float
        run: cargo test -p nanoaudio -p nanoaudio-dsp --features float

      - name: Test with all Features and Coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/nanoaudio
          files: lcov.info
          fail_ci_if_error: true

  crates:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Test and build each Crate on its own
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::$crate"
            cargo test -p "$crate"
            cargo build -p "$crate" --target thumbv6m-none-eabi
            echo "::endgroup::"
          done

  embedded:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - riscv32imafc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Build with all Features
        run: cargo build --workspace --target ${{ matrix.target }} --all-features

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Build for the browser
        run: cargo build --workspace --all-features --target wasm32-unknown-unknown

      - name: Build for the browser with SIMD
        run: cargo build --workspace --all-features --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -C target-feature=+simd128

      - name: Test on WASI
        run: cargo test --workspace --all-features --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=/

      - name: Test on WASI with SIMD
        run: cargo test --workspace --all-features --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=/
          RUSTFLAGS: -C target-feature=+simd128

  asm:
    needs: changes
    if: needs.changes.outputs.asm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf, thumbv8m.main-none-eabihf

      - name: Check Hot Loops
        run: python3 tools/asm-probe/check.py

      - name: Check Hot Loops optimized for Size
        run: python3 tools/asm-probe/check.py --opt-level s

  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Build the Benchmarks
        run: cargo build --release --manifest-path tools/bench/Cargo.toml

      - name: Run the untimed Benchmarks
        run: |
          cargo run --release --manifest-path tools/bench/Cargo.toml -- memory
          cargo run --release --manifest-path tools/bench/Cargo.toml -- quality

      - name: Build the Flash Probes
        run: cargo build --release --manifest-path tools/bench/flash/Cargo.toml --target thumbv6m-none-eabi

      - name: Check the Script
        run: python3 -m py_compile tools/bench/run.py

  miri:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri
        run: cargo miri test --workspace --lib

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89

      - name: Test
        run: cargo test --workspace

      - name: Test with all Features
        run: cargo test --workspace --all-features

  package:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package
        run: cargo package --workspace

  coverage-skipped:
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tell Codecov there is no code change
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AlixANNERAUD/nanoaudio
          run_command: empty-upload
          fail_ci_if_error: false

  ci:
    needs: [changes, check, crates, embedded, wasm, asm, bench, miri, msrv, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed Job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          results = {name: job['result'] for name, job in json.load(sys.stdin).items()}
          print(results)
          sys.exit(any(result not in ('success', 'skipped') for result in results.values()))
          "
